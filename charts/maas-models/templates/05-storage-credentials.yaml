{{/*
S3 credentials for the KServe storage-initializer.

KServe resolves object-storage credentials through exactly one path: the Secrets
listed in `serviceAccount.secrets[]` of the pod's ServiceAccount. It then reads
the Secret's annotations to build the S3_ and AWS_ environment variables. Neither
half works alone — a correctly annotated Secret that no ServiceAccount references
is invisible, and a ServiceAccount referencing an unannotated Secret yields
credentials with no endpoint or region.

This template renders both halves, in every namespace that has a model using the
profile, and links them.
*/}}
{{- $root := . -}}
{{- $profiles := (.Values.storage | default dict).s3 | default list -}}
{{- range $p := $profiles }}
{{- if ne $p.enabled false }}
{{- $saName := $p.serviceAccountName | default (printf "maas-s3-%s" $p.name) }}
{{- $secretName := $p.existingSecret | default (printf "maas-s3-%s" $p.name) }}

{{/* Namespaces that actually need this profile. */}}
{{- $namespaces := list }}
{{- range $m := (include "maas-models.enabledModels" $root | fromJsonArray) }}
{{- if eq (($m.inference | default dict).storageProfile | default "") $p.name }}
{{- $namespaces = append $namespaces (include "maas-models.modelNamespace" (dict "root" $root "model" $m)) }}
{{- end }}
{{- end }}
{{- $namespaces = concat $namespaces ($p.extraNamespaces | default list) | uniq | sortAlpha }}

{{/*
S3 settings become annotations on the Secret. Values pass through to env vars
verbatim, so they are quoted strings — "1"/"0", not true/false.
*/}}
{{- $s3ann := dict }}
{{- with $p.endpoint }}{{- $_ := set $s3ann "serving.kserve.io/s3-endpoint" (. | toString) }}{{- end }}
{{- with $p.region }}{{- $_ := set $s3ann "serving.kserve.io/s3-region" (. | toString) }}{{- end }}
{{- with $p.useHttps }}{{- $_ := set $s3ann "serving.kserve.io/s3-usehttps" (. | toString) }}{{- end }}
{{- with $p.verifySsl }}{{- $_ := set $s3ann "serving.kserve.io/s3-verifyssl" (. | toString) }}{{- end }}
{{- with $p.useVirtualBucket }}{{- $_ := set $s3ann "serving.kserve.io/s3-usevirtualbucket" (. | toString) }}{{- end }}
{{- with $p.useAccelerate }}{{- $_ := set $s3ann "serving.kserve.io/s3-useaccelerate" (. | toString) }}{{- end }}
{{- with $p.useAnonymousCredential }}{{- $_ := set $s3ann "serving.kserve.io/s3-useanoncredential" (. | toString) }}{{- end }}
{{- with $p.caBundleConfigMap }}{{- $_ := set $s3ann "serving.kserve.io/s3-cabundle-configmap" (. | toString) }}{{- end }}

{{- range $ns := $namespaces }}

{{- if $p.create }}
---
{{/*
Sandbox convenience only: this writes the access key into git. In production use
`existingSecret` with a Secret produced by the External Secrets Operator or
Sealed Secrets, or `roleArn` for AWS IRSA and no static key at all.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  {{- include "maas-models.metadata" (dict
        "root" $root
        "component" "s3-credentials"
        "wave" "secret"
        "annotations" $s3ann
        "extraLabels" (dict "maas.pase52.io/storage-profile" $p.name)) | nindent 2 }}
type: Opaque
stringData:
  {{/* Key names are KServe's defaults — do not rename them. */}}
  awsAccessKeyID: {{ $p.accessKeyId | quote }}
  awsSecretAccessKey: {{ $p.secretAccessKey | quote }}
{{- else if and $p.existingSecret $p.annotateExistingSecret }}
---
{{/*
Patch the S3 settings onto a Secret whose *data* is managed elsewhere. Rendering
no `data`/`stringData` leaves the existing keys untouched under a merge apply.
Requires ServerSideApply; without it Argo CD would prune the credential keys.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  {{- include "maas-models.metadata" (dict
        "root" $root
        "component" "s3-credentials"
        "wave" "secret"
        "annotations" (merge (dict "argocd.argoproj.io/sync-options" "ServerSideApply=true") $s3ann)
        "extraLabels" (dict "maas.pase52.io/storage-profile" $p.name)) | nindent 2 }}
type: Opaque
{{- end }}
---
{{/*
The ServiceAccount is the lookup key. `spec.template.serviceAccountName` on the
LLMInferenceService points here; KServe walks `secrets[]` to find the credential.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  {{- include "maas-models.metadata" (dict
        "root" $root
        "component" "s3-serviceaccount"
        "wave" "secret"
        "annotations" (ternary (dict "eks.amazonaws.com/role-arn" ($p.roleArn | default "")) (dict) (not (empty $p.roleArn)))
        "extraLabels" (dict "maas.pase52.io/storage-profile" $p.name)) | nindent 2 }}
{{- if not $p.roleArn }}
secrets:
  - name: {{ $secretName }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
