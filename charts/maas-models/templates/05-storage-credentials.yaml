{{/*
S3 credentials for the KServe storage-initializer.

KServe resolves object-storage credentials through exactly one path: the Secrets
listed in `serviceAccount.secrets[]` of the pod's ServiceAccount. It then reads
the Secret's annotations to build the S3_ and AWS_ environment variables. Neither
half works alone — a correctly annotated Secret that no ServiceAccount references
is invisible, and a ServiceAccount referencing an unannotated Secret yields
credentials with no endpoint or region.

This template renders both halves, in every namespace that has a model using the
profile, and links them.
*/}}
{{- $root := . -}}

{{/*
=============================================================================
Vault-backed credentials — one Vault secret, ExternalSecret and ServiceAccount
per model.
=============================================================================
Per-model rather than per-bucket so a single model's credential can be rotated
or revoked without touching any other model. The ExternalSecret pulls
<basePath>/<model> from the shared store into a Secret named after the model,
and the model's ServiceAccount references exactly that Secret.
*/}}
{{- $esDefaults := (.Values.storage | default dict).externalSecrets | default dict -}}
{{- $apiVersion := $esDefaults.apiVersion | default "external-secrets.io/v1" -}}
{{- $store := (.Values.storage | default dict).secretStore | default dict -}}
{{- range $m := (include "maas-models.enabledModels" $root | fromJsonArray) }}
{{- $p := (include "maas-models.storageProfile" (dict "root" $root "model" $m) | fromJson) }}
{{- $es := $p.externalSecret | default dict }}
{{- if and $p.name (ne $p.enabled false) $es.enabled }}
{{- $ns := include "maas-models.modelNamespace" (dict "root" $root "model" $m) }}
{{- $saName := include "maas-models.storageServiceAccount" (dict "root" $root "model" $m) }}
{{- $secretName := printf "maas-s3-%s" $m.name }}
{{- $props := $es.properties | default dict }}
{{- $storeRef := $es.storeRef | default dict }}
---
apiVersion: {{ $apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  {{- include "maas-models.metadata" (dict
        "root" $root
        "model" $m
        "component" "s3-external-secret"
        "wave" "secret"
        "extraLabels" (dict "maas.pase52.io/storage-profile" $p.name)) | nindent 2 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default $esDefaults.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $storeRef.name | default $store.name }}
    kind: {{ $storeRef.kind | default $store.kind | default "ClusterSecretStore" }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      {{/*
      mergePolicy defaults to Replace, which would discard everything fetched
      from Vault and leave an annotated Secret with no keys — the exact failure
      that shows up later as "Unable to locate credentials" on a Secret that
      looks correct. Merge keeps the fetched data and overlays the metadata.
      */}}
      mergePolicy: Merge
      metadata:
        annotations:
          {{- include "maas-models.s3Annotations" $p | fromJson | toYaml | nindent 10 }}
        labels:
          maas.pase52.io/model: {{ $m.name | quote }}
          maas.pase52.io/storage-profile: {{ $p.name | quote }}
  data:
    {{/*
    Key names on the left are KServe's defaults and must not be renamed; the
    `property` on the right is the field name inside the Vault secret.
    */}}
    - secretKey: awsAccessKeyID
      remoteRef:
        key: {{ include "maas-models.vaultKey" (dict "model" $m "profile" $p) | quote }}
        property: {{ $props.accessKeyId | default "accessKeyId" | quote }}
    - secretKey: awsSecretAccessKey
      remoteRef:
        key: {{ include "maas-models.vaultKey" (dict "model" $m "profile" $p) | quote }}
        property: {{ $props.secretAccessKey | default "secretAccessKey" | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  {{- include "maas-models.metadata" (dict
        "root" $root
        "model" $m
        "component" "s3-serviceaccount"
        "wave" "secret"
        "extraLabels" (dict "maas.pase52.io/storage-profile" $p.name)) | nindent 2 }}
secrets:
  - name: {{ $secretName }}
{{- end }}
{{- end }}

{{/*
=============================================================================
Shared credentials — one Secret and ServiceAccount per bucket profile.
=============================================================================
*/}}
{{- $profiles := (.Values.storage | default dict).s3 | default list -}}
{{- range $p := $profiles }}
{{- if and (ne $p.enabled false) (not (($p.externalSecret | default dict).enabled)) }}
{{- $saName := $p.serviceAccountName | default (printf "maas-s3-%s" $p.name) }}
{{- $secretName := $p.existingSecret | default (printf "maas-s3-%s" $p.name) }}

{{/* Namespaces that actually need this profile. */}}
{{- $namespaces := list }}
{{- range $m := (include "maas-models.enabledModels" $root | fromJsonArray) }}
{{- if eq (($m.inference | default dict).storageProfile | default "") $p.name }}
{{- $namespaces = append $namespaces (include "maas-models.modelNamespace" (dict "root" $root "model" $m)) }}
{{- end }}
{{- end }}
{{- $namespaces = concat $namespaces ($p.extraNamespaces | default list) | uniq | sortAlpha }}

{{- $s3ann := (include "maas-models.s3Annotations" $p | fromJson) }}

{{- range $ns := $namespaces }}

{{- if $p.create }}
---
{{/*
Sandbox convenience only: this writes the access key into git. In production use
`existingSecret` with a Secret produced by the External Secrets Operator or
Sealed Secrets, or `roleArn` for AWS IRSA and no static key at all.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  {{- include "maas-models.metadata" (dict
        "root" $root
        "component" "s3-credentials"
        "wave" "secret"
        "annotations" $s3ann
        "extraLabels" (dict "maas.pase52.io/storage-profile" $p.name)) | nindent 2 }}
type: Opaque
stringData:
  {{/* Key names are KServe's defaults — do not rename them. */}}
  awsAccessKeyID: {{ $p.accessKeyId | quote }}
  awsSecretAccessKey: {{ $p.secretAccessKey | quote }}
{{- else if and $p.existingSecret $p.annotateExistingSecret }}
---
{{/*
Patch the S3 settings onto a Secret whose *data* is managed elsewhere. Rendering
no `data`/`stringData` leaves the existing keys untouched under a merge apply.
Requires ServerSideApply; without it Argo CD would prune the credential keys.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  {{- include "maas-models.metadata" (dict
        "root" $root
        "component" "s3-credentials"
        "wave" "secret"
        "annotations" (merge (dict "argocd.argoproj.io/sync-options" "ServerSideApply=true") $s3ann)
        "extraLabels" (dict "maas.pase52.io/storage-profile" $p.name)) | nindent 2 }}
type: Opaque
{{- end }}
---
{{/*
The ServiceAccount is the lookup key. `spec.template.serviceAccountName` on the
LLMInferenceService points here; KServe walks `secrets[]` to find the credential.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  {{- include "maas-models.metadata" (dict
        "root" $root
        "component" "s3-serviceaccount"
        "wave" "secret"
        "annotations" (ternary (dict "eks.amazonaws.com/role-arn" ($p.roleArn | default "")) (dict) (not (empty $p.roleArn)))
        "extraLabels" (dict "maas.pase52.io/storage-profile" $p.name)) | nindent 2 }}
{{- if not $p.roleArn }}
secrets:
  - name: {{ $secretName }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
