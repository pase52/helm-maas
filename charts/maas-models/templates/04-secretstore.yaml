{{/*
The single External Secrets Operator store backing every model's object-storage
credential.

Kubernetes auth means no static Vault credential exists anywhere in the cluster:
Vault validates the ESO controller's ServiceAccount token against the configured
role. That is the reason to prefer it over AppRole or a static token, both of
which reintroduce a long-lived secret that has to live somewhere.

A ClusterSecretStore is cluster-scoped and shared by every model namespace. A
SecretStore is namespaced, so one is rendered per namespace that has a model
using Vault.
*/}}
{{- $root := . -}}
{{- $store := (.Values.storage | default dict).secretStore | default dict -}}
{{- if and $store.enabled $store.create -}}
{{- $vault := $store.vault | default dict -}}
{{- $auth := $vault.auth | default dict -}}

{{/* Namespaces needing a namespaced SecretStore. Empty for ClusterSecretStore. */}}
{{- $namespaces := list -}}
{{- if ne $store.kind "ClusterSecretStore" -}}
{{- range $m := (include "maas-models.enabledModels" $root | fromJsonArray) -}}
{{- $p := (include "maas-models.storageProfile" (dict "root" $root "model" $m) | fromJson) -}}
{{- if (($p.externalSecret | default dict).enabled) -}}
{{- $namespaces = append $namespaces (include "maas-models.modelNamespace" (dict "root" $root "model" $m)) -}}
{{- end -}}
{{- end -}}
{{- $namespaces = $namespaces | uniq | sortAlpha -}}
{{- else -}}
{{- $namespaces = list "" -}}
{{- end -}}

{{/* SecretStore and ExternalSecret share the ESO API group/version. */}}
{{- $apiVersion := (($root.Values.storage.externalSecrets | default dict).apiVersion | default "external-secrets.io/v1") -}}
{{- range $ns := $namespaces }}
---
apiVersion: {{ $apiVersion }}
kind: {{ $store.kind | default "ClusterSecretStore" }}
metadata:
  name: {{ $store.name }}
  {{- if $ns }}
  namespace: {{ $ns }}
  {{- end }}
  {{- include "maas-models.metadata" (dict
        "root" $root
        "component" "secret-store"
        "wave" "secretStore") | nindent 2 }}
spec:
  provider:
    vault:
      server: {{ $vault.server | quote }}
      path: {{ $vault.path | default "secret" | quote }}
      version: {{ $vault.version | default "v2" | quote }}
      {{- with $vault.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with $vault.caProviderConfigMap }}
      caProvider:
        type: ConfigMap
        name: {{ . }}
        key: {{ $vault.caProviderConfigMapKey | default "ca.crt" }}
        {{- if $ns }}
        namespace: {{ $ns }}
        {{- end }}
      {{- end }}
      auth:
        {{- if (($auth.kubernetes | default dict).enabled) }}
        kubernetes:
          mountPath: {{ $auth.kubernetes.mountPath | default "kubernetes" }}
          role: {{ $auth.kubernetes.role | quote }}
          serviceAccountRef:
            name: {{ $auth.kubernetes.serviceAccountRef.name }}
            {{- with $auth.kubernetes.serviceAccountRef.namespace }}
            namespace: {{ . }}
            {{- end }}
        {{- else if (($auth.appRole | default dict).enabled) }}
        appRole:
          path: {{ $auth.appRole.path | default "approle" }}
          roleId: {{ $auth.appRole.roleId | quote }}
          secretRef:
            name: {{ $auth.appRole.secretRef.name }}
            key: {{ $auth.appRole.secretRef.key | default "secretId" }}
            {{- with $auth.appRole.secretRef.namespace }}
            namespace: {{ . }}
            {{- end }}
        {{- else if (($auth.tokenSecretRef | default dict).name) }}
        tokenSecretRef:
          name: {{ $auth.tokenSecretRef.name }}
          key: {{ $auth.tokenSecretRef.key | default "token" }}
          {{- with $auth.tokenSecretRef.namespace }}
          namespace: {{ . }}
          {{- end }}
        {{- end }}
{{- end }}
{{- end }}
